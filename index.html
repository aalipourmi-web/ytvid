<script>
        // 1. YOUR YOUTUBE VIDEO ID
        const VIDEO_ID = '3sgj8fDxyfw'; 

        // 2. Load the YouTube IFrame Player API asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        let serverOffset = 0; // Will match the audio site's server offset

        // 3. Create the <iframe> after the API downloads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,    
                    'rel': 0,         
                    'showinfo': 0,    
                    'modestbranding': 1,
                    'mute': 1         // Must stay muted to allow autoplay
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 4. Fetch WorldTimeAPI just like index_2.html does to align clocks
        async function calibrateWithServer() {
            try {
                const start = performance.now();
                const response = await fetch(`https://worldtimeapi.org/api/timezone/Etc/UTC?nocache=${Math.random()}`);
                const data = await response.json();
                const end = performance.now();
                
                const rtt = end - start; 
                const networkDelay = rtt / 2;
                const serverMs = new Date(data.utc_datetime).getTime();
                
                // This locks the video site into the exact same universal time grid
                serverOffset = serverMs - (Date.now() - networkDelay);
                console.log("Video server calibration successful.");
            } catch (e) {
                console.error("Server sync failed, falling back to local clock.", e);
                serverOffset = 0;
            }
        }

        // Kick off the clock calibration immediately
        calibrateWithServer();

        // 5. Calculate perfect sync time matching index_2.html's UTC formula
        function getPerfectSyncTime(durationSeconds) {
            if (!durationSeconds || isNaN(durationSeconds)) return 0;
            
            // Get exact time adjusted for server lag
            const exactNow = Date.now() + serverOffset;
            const syncedDate = new Date(exactNow);
            
            // Generate a strict UTC Midnight anchor point 
            const midnight = new Date(Date.UTC(syncedDate.getUTCFullYear(), syncedDate.getUTCMonth(), syncedDate.getUTCDate(), 0, 0, 0));
            
            const msElapsedToday = exactNow - midnight.getTime();
            const durationMs = durationSeconds * 1000;
            
            // Return current position within the current loop cycle (in seconds)
            return (msElapsedToday % durationMs) / 1000;
        }

        // 6. Push video to the exact time slot
        function syncVideoToClock() {
            if (player && typeof player.getDuration === 'function') {
                const videoDuration = player.getDuration();
                if (videoDuration > 0) {
                    const targetTime = getPerfectSyncTime(videoDuration);
                    player.seekTo(targetTime, true);
                    player.playVideo();
                }
            }
        }

        // 7. Trigger sync on player ready state
        function onPlayerReady(event) {
            setTimeout(() => {
                syncVideoToClock();
                
                // Periodic micro-sync correction check every 5 seconds to eliminate playback drift
                setInterval(() => {
                    if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                        const currentVideoTime = player.getCurrentTime();
                        const correctTime = getPerfectSyncTime(player.getDuration());
                        
                        // If drift is more than 200 milliseconds, quietly pull it back into sync
                        if (Math.abs(currentVideoTime - correctTime) > 0.2) {
                            player.seekTo(correctTime, true);
                        }
                    }
                }, 5000);
            }, 600);
        }

        // 8. Handle loop cycles seamlessly
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                syncVideoToClock();
            }
        }
    </script>
