<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synced YouTube Loop</title>
    <style>
        /* Make the video fill the entire screen */
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Prevents clicking pause/play manually */
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // 1. REPLACE THIS WITH YOUR YOUTUBE VIDEO ID
        // (The letters/numbers after "v=" in a YouTube URL)
        const VIDEO_ID = '3sgj8fDxyfw'; 

        // 2. Load the YouTube IFrame Player API asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        
        // 3. This function creates the <iframe> after the API code downloads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,    // Hide YouTube controls
                    'rel': 0,         // Don't show related videos
                    'showinfo': 0,    // Hide video title
                    'modestbranding': 1,
                    'mute': 1         // MUST be muted to allow autoplay in modern browsers
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 4. Calculate seconds since midnight and sync the video
        function syncVideoToMidnight(playerInstance) {
            const now = new Date();
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            
            // Get total seconds passed since midnight today
            const secondsSinceMidnight = (now.getTime() - midnight.getTime()) / 1000;
            
            // Get the total duration of the video
            const videoDuration = playerInstance.getDuration();
            
            if (videoDuration > 0) {
                // Determine where the video *should* be in its loop cycle
                const currentVideoTime = secondsSinceMidnight % videoDuration;
                
                playerInstance.seekTo(currentVideoTime, true);
                playerInstance.playVideo();
            }
        }

        // 5. When the player is ready, sync it
        function onPlayerReady(event) {
            // We need a slight delay because getDuration() sometimes returns 0 immediately on load
            setTimeout(() => {
                syncVideoToMidnight(event.target);
            }, 500);
        }

        // 6. Handle looping seamlessly
        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED is 0
            if (event.data === YT.PlayerState.ENDED) {
                // Instead of just restarting from 0, re-sync to midnight 
                // to account for any drift or loading lag.
                syncVideoToMidnight(event.target);
            }
        }
    </script>
</body>
</html>
