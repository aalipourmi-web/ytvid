<script>
        const VIDEO_ID = '3sgj8fDxyfw'; 
        
        // 🔒 Locked to the exact MP3 duration
        const MASTER_DURATION = 167.764172; 

        let serverOffset = 0;
        let isCalibrated = false;
        let playerReady = false;
        let player;

        // 1. Fetch exact UTC time and calculate latency
        async function calibrateWithServer() {
            let lowestLatency = Infinity;
            for (let i = 0; i < 4; i++) {
                try {
                    const start = performance.now();
                    const response = await fetch(`https://worldtimeapi.org/api/timezone/Etc/UTC?nocache=${Math.random()}`);
                    const data = await response.json();
                    const rtt = performance.now() - start; 
                    
                    if (rtt < lowestLatency) {
                        lowestLatency = rtt;
                        serverOffset = new Date(data.utc_datetime).getTime() - (Date.now() - (rtt / 2));
                    }
                } catch (e) { console.error("Ping failed"); }
            }
            isCalibrated = true;
            if (playerReady) syncVideoToUTC();
        }

        calibrateWithServer();

        // 2. Load YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1, 'controls': 0, 'rel': 0, 
                    'showinfo': 0, 'modestbranding': 1, 'mute': 1         
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. Get exact UTC Time target using the Master Duration
        function getTargetTime() {
            const exactNow = Date.now() + serverOffset;
            const syncedDate = new Date(exactNow);
            const midnight = new Date(Date.UTC(syncedDate.getUTCFullYear(), syncedDate.getUTCMonth(), syncedDate.getUTCDate(), 0, 0, 0));
            
            const msElapsedToday = exactNow - midnight.getTime();
            return (msElapsedToday / 1000) % MASTER_DURATION;
        }

        function syncVideoToUTC() {
            if (!isCalibrated || !playerReady) return;
            player.seekTo(getTargetTime(), true);
            player.playVideo();
        }

        function onPlayerReady(event) {
            playerReady = true;
            if (isCalibrated) syncVideoToUTC();
            startDriftCorrection(); 
        }

        // 4. The Heartbeat: Continuously fix YouTube's lag
        function startDriftCorrection() {
            setInterval(() => {
                if (!playerReady || player.getPlayerState() !== YT.PlayerState.PLAYING) return;

                const expectedTime = getTargetTime();
                const actualTime = player.getCurrentTime();

                if (Math.abs(expectedTime - actualTime) > 0.5) {
                    player.seekTo(expectedTime, true);
                }
            }, 1000); 
        }
    </script>
