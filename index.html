<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearHere - Video Node</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #010118;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Container that forces the YouTube video to fill the screen nicely */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        iframe, #player {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        // 1. YOUR YOUTUBE CONFIG
        const VIDEO_ID = '3sgj8fDxyfw'; 

        // Load the YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        let serverOffset = 0;
        let isCalibrated = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,    
                    'rel': 0,         
                    'showinfo': 0,    
                    'modestbranding': 1,
                    'mute': 1 // Stays muted to bypass browser autoplay blocks
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 2. SERVER CALIBRATION (Directly matching your audio site)
        async function calibrateWithServer() {
            try {
                const start = performance.now();
                const response = await fetch(`https://worldtimeapi.org/api/timezone/Etc/UTC?nocache=${Math.random()}`);
                const data = await response.json();
                const end = performance.now();
                
                const rtt = end - start; 
                const networkDelay = rtt / 2;
                const serverMs = new Date(data.utc_datetime).getTime();
                
                serverOffset = serverMs - (Date.now() - networkDelay);
                isCalibrated = true;
                console.log(`Video Sync calibrated. Server Offset: ${serverOffset}ms`);
            } catch (e) {
                console.error("Sync failed.", e);
                serverOffset = 0;
            }
        }

        // Execute calibration immediately
        calibrateWithServer();

        // 3. MASTER TIME CALCULATOR
        function getPerfectSyncTime(durationSeconds) {
            if (!durationSeconds || isNaN(durationSeconds) || durationSeconds <= 0) return 0;
            
            const exactNow = Date.now() + serverOffset;
            const syncedDate = new Date(exactNow);
            
            // Strict UTC Midnight reference anchor
            const midnight = new Date(Date.UTC(syncedDate.getUTCFullYear(), syncedDate.getUTCMonth(), syncedDate.getUTCDate(), 0, 0, 0));
            
            const msElapsedToday = exactNow - midnight.getTime();
            const durationMs = durationSeconds * 1000;
            
            return (msElapsedToday % durationMs) / 1000;
        }

        // 4. SAFE EXECUTION JUMP
        function executeVideoSync() {
            if (!player || typeof player.getDuration !== 'function') return;

            const duration = player.getDuration();
            
            // If YouTube hasn't loaded video data yet, wait 100ms and retry
            if (duration <= 0) {
                setTimeout(executeVideoSync, 100);
                return;
            }

            const jumpToSeconds = getPerfectSyncTime(duration);
            player.seekTo(jumpToSeconds, true);
            player.playVideo();
            console.log(`Video snapped to shared timeline: ${jumpToSeconds}s`);
        }

        // 5. EVENT HANDLERS & DRIFT WATCHDOG
        function onPlayerReady(event) {
            executeVideoSync();
            
            // Anti-drift looping monitor (Runs every 2 seconds)
            setInterval(() => {
                if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    const currentVideoTime = player.getCurrentTime();
                    const duration = player.getDuration();
                    
                    if (duration > 0) {
                        const targetTime = getPerfectSyncTime(duration);
                        
                        // If browser tab throttling drifts the video by more than 250ms, snap it back
                        if (Math.abs(currentVideoTime - targetTime) > 0.25) {
                            player.seekTo(targetTime, true);
                            console.log("Drift corrected.");
                        }
                    }
                }
            }, 2000);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                executeVideoSync();
            }
        }
    </script>
</body>
</html>
