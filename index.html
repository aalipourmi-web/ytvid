<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Synced YouTube Loop</title>
    <style>
        /* Make the video fill the entire screen */
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Prevents clicking pause/play manually */
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // 1. REPLACE THIS WITH YOUR YOUTUBE VIDEO ID
        const VIDEO_ID = '3sgj8fDxyfw'; 

        // State variables for precision timing
        let serverOffset = 0;
        let isCalibrated = false;
        let playerReady = false;
        let player;

        // 2. Fetch exact UTC time and calculate latency offset (Ported from Audio Player)
        async function calibrateWithServer() {
            let bestOffset = 0;
            let lowestLatency = Infinity;
            const pingCount = 4; 

            try {
                for (let i = 0; i < pingCount; i++) {
                    const start = performance.now();
                    const response = await fetch(`https://worldtimeapi.org/api/timezone/Etc/UTC?nocache=${Math.random()}`);
                    const data = await response.json();
                    const end = performance.now();
                    
                    const rtt = end - start; 
                    
                    if (rtt < lowestLatency) {
                        lowestLatency = rtt;
                        const networkDelay = rtt / 2;
                        const serverMs = new Date(data.utc_datetime).getTime();
                        bestOffset = serverMs - (Date.now() - networkDelay);
                    }
                }
                
                serverOffset = bestOffset;
                isCalibrated = true;
                console.log(`Sync calibrated. Server Offset: ${serverOffset}ms. Network Latency: ${Math.round(lowestLatency / 2)}ms`);
                
                // If the YouTube iframe finished loading while we were pinging the server, sync it now
                if (playerReady) syncVideoToUTC();
                
            } catch (e) {
                console.error("Sync failed. Falling back to local clock.", e);
                isCalibrated = true; // Proceed anyway with a 0 offset
                if (playerReady) syncVideoToUTC();
            }
        }

        // Start server calibration immediately
        calibrateWithServer();

        // 3. Load the YouTube IFrame Player API asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 4. This function creates the <iframe> after the API code downloads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,    
                    'rel': 0,         
                    'showinfo': 0,    
                    'modestbranding': 1,
                    'mute': 1         
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 5. Calculate precise position based on Universal UTC Server Time
        function syncVideoToUTC() {
            // Wait until both the server data and the YouTube player are ready
            if (!isCalibrated || !playerReady) return;

            const videoDuration = player.getDuration();
            
            // Sometimes getDuration() takes a fraction of a second longer to populate
            if (videoDuration <= 0) {
                setTimeout(syncVideoToUTC, 100);
                return;
            }

            // Calculate the exact time using the server offset
            const exactNow = Date.now() + serverOffset;
            const syncedDate = new Date(exactNow);
            
            // Lock into Universal UTC Midnight (Ensures cross-timezone sync)
            const midnight = new Date(Date.UTC(syncedDate.getUTCFullYear(), syncedDate.getUTCMonth(), syncedDate.getUTCDate(), 0, 0, 0));
            
            const msElapsedToday = exactNow - midnight.getTime();
            const currentVideoTime = (msElapsedToday / 1000) % videoDuration;
            
            player.seekTo(currentVideoTime, true);
            player.playVideo();
        }

        // 6. When the player is ready, mark it and attempt sync
        function onPlayerReady(event) {
            playerReady = true;
            // Delay slightly to ensure duration is loaded, then sync (if calibration is already done)
            setTimeout(() => {
                if (isCalibrated) {
                    syncVideoToUTC();
                }
            }, 500);
        }

        // 7. Handle looping seamlessly
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                // Re-sync to the precise UTC server clock every loop to prevent drift
                syncVideoToUTC();
            }
        }
    </script>
</body>
</html>
